# Compila Windows-Manager con Qt 6 y MinGW en cada push (en un Windows de GitHub).
name: Compilar

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Qt y MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.0'
          host: windows
          target: desktop
          arch: win64_mingw
          tools: 'tools_mingw1310'
          cache: true
      - name: Compilar
        shell: bash
        run: |
          export PATH="$IQTA_TOOLS/mingw1310_64/bin:$PATH"
          cmake -S gui -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build
